name: movie_ticket_booking
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^3.2.1
  state_notifier: ^1.0.0
  go_router: ^17.1.0
  dio: ^5.7.0
  equatable: ^2.0.8
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  youtube_player_iframe: ^5.1.2
  shared_preferences: ^2.2.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/mock/movies.json
    - assets/mock/watchlist.json
    - assets/mock/payment_methods.json
    - assets/payment/
    - assets/mock/notifications.json
    - assets/mock/account.json

    - assets/images/icons/  
    - assets/mock/accounts.json
    - assets/mock/cinemas.json
    - assets/mock/showtimes.json
    - assets/mock/seats.json
    - assets/mock/combos.json

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/montserrat/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/montserrat/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/montserrat/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/montserrat/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/montserrat/Montserrat-ExtraBold.ttf
          weight: 800
