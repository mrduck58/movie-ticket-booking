services:
  # ========================================================
  # 1. SQL SERVER DATABASE
  # ========================================================
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: movie-booking-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong@Password123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -Q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ========================================================
  # 2. .NET 9 BACKEND API
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movie-booking-backend
    ports:
      - "7132:8080"
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db,1433;Database=MovieTicketBookingDB;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
      - Jwt__Key=THIS_IS_SUPER_SECRET_KEY_FOR_MOVIE_BOOKING_SYSTEM_123456
      - Jwt__Issuer=MovieBookingAPI
      - Jwt__Audience=MovieBookingClient
      - PayOS__ClientId=6a6fd598-7384-4485-a362-3b50322596c8
      - PayOS__ApiKey=dcd06e77-58a0-489e-ba0d-e91ea1e03603
      - PayOS__ChecksumKey=eabf512e5dd7cb709bf18878e0e526ad9993c4674ae491dffd63df5b3737961c
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ========================================================
  # 3. FLUTTER WEB FRONTEND (Nginx)
  # ========================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: movie-booking-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mssql_data:
