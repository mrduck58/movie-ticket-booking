services:
  # ========================================================
  # 1. LOCAL POSTGRESQL (Tùy chọn chạy offline nhẹ chỉ ~30MB RAM)
  # ========================================================
  db:
    image: postgres:16-alpine
    container_name: movie-booking-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourStrong@Password123
      POSTGRES_DB: MovieTicketBookingDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================================
  # 2. .NET 9 BACKEND API
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movie-booking-backend
    ports:
      - "7132:8080"
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Mặc định kết nối tới Supabase nếu có trong .env, nếu không thì kết nối tới container db cục bộ
      - ConnectionStrings__DefaultConnection=${SUPABASE_CONNECTION_STRING:-Host=db;Port=5432;Database=MovieTicketBookingDB;Username=postgres;Password=YourStrong@Password123;SSL Mode=Disable;}
      - Jwt__Key=THIS_IS_SUPER_SECRET_KEY_FOR_MOVIE_BOOKING_SYSTEM_123456
      - Jwt__Issuer=MovieBookingAPI
      - Jwt__Audience=MovieBookingClient
      - PayOS__ClientId=6a6fd598-7384-4485-a362-3b50322596c8
      - PayOS__ApiKey=dcd06e77-58a0-489e-ba0d-e91ea1e03603
      - PayOS__ChecksumKey=eabf512e5dd7cb709bf18878e0e526ad9993c4674ae491dffd63df5b3737961c
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ========================================================
  # 3. FLUTTER WEB FRONTEND (Nginx)
  # ========================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: movie-booking-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
