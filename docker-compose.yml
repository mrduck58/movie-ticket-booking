services:
  # ========================================================
  # 1. LOCAL POSTGRESQL (Tùy chọn chạy offline nhẹ chỉ ~30MB RAM)
  # ========================================================
  db:
    image: postgres:16-alpine
    container_name: movie-booking-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: YourStrong@Password123
      POSTGRES_DB: MovieTicketBookingDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ========================================================
  # 2. .NET 9 BACKEND API
  # ========================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: movie-booking-backend
    ports:
      - "7132:8080"
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      # Mặc định kết nối tới Supabase nếu có trong .env, nếu không thì kết nối tới container db cục bộ
      - ConnectionStrings__DefaultConnection=${SUPABASE_CONNECTION_STRING:-Host=db;Port=5432;Database=MovieTicketBookingDB;Username=postgres;Password=YourStrong@Password123;SSL Mode=Disable;}
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=MovieBookingAPI
      - Jwt__Audience=MovieBookingClient
      - PayOS__ClientId=${PAYOS_CLIENT_ID}
      - PayOS__ApiKey=${PAYOS_API_KEY}
      - PayOS__ChecksumKey=${PAYOS_CHECKSUM_KEY}
      - EmailSettings__Sender=${EMAIL_SENDER}
      - EmailSettings__Password=${EMAIL_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # ========================================================
  # 3. FLUTTER WEB FRONTEND (Nginx)
  # ========================================================
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: movie-booking-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
